name: model_check
description: >-
  Checks the exported route-question model through the same runtime the app uses (llamadart), on the 300 validation questions.
  ADR-035, PREREGISTRATION_QA.md addendum 5. A development tool; not shipped.
publish_to: none
version: 0.0.0

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  llamadart: ^0.12.2
  pulse_explain:
    path: ../../packages/pulse_explain
  pulse_router:
    path: ../../packages/pulse_router
