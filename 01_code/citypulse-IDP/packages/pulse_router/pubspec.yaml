name: pulse_router
description: >
  CityPulse AI's routing core — CSR road graph, bidirectional Dijkstra, and the
  ADR-003 hazard-aware edge cost function with chance-constraint edge removal.
  Pure Dart, no I/O: the same package the Flutter client imports directly and
  the Dart AOT evaluation CLI (T2.4) wraps. Never fork this into a second
  language (docs/DECISIONS.md ADR-001).
version: 0.1.0
publish_to: "none"

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  args: ^2.7.0
  collection: ^1.19.0
  pulse_belief:
    path: ../pulse_belief

dev_dependencies:
  yaml: ^3.1.3
  test: ^1.25.0
  very_good_analysis: ^7.0.0
