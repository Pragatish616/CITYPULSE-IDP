<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="CityPulse: offline-first, flood-aware routes for Chennai. A research prototype; it does not guarantee any road is safe.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1F5FA8">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CityPulse">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CityPulse</title>
  <link rel="manifest" href="manifest.json">

  <!-- Faster first map: open the tile server connection and fetch the map library while Flutter starts, instead of after. -->
  <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
  <link rel="dns-prefetch" href="https://tiles.openfreemap.org">
  <link rel="modulepreload" href="vendor/maplibre-gl/maplibre-gl.mjs">
  <link rel="modulepreload" href="vendor/maplibre-gl/maplibre-gl-shared.mjs">
  <link rel="preload" href="vendor/maplibre-gl/maplibre-gl.css" as="style">

  <style>
    /* Shown at once while the app starts (a cold free server can take several seconds); removed on Flutter's first frame. */
    #cp-splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; background: #F4F6F9; color: #1F2937; font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    #cp-splash b { color: #1F5FA8; font-size: 22px; }
    #cp-splash .bar { width: 160px; height: 4px; border-radius: 2px; background: #DCE3EE; overflow: hidden; }
    #cp-splash .bar i { display: block; width: 40%; height: 100%; background: #1F5FA8; animation: cp-slide 1.1s ease-in-out infinite; }
    @keyframes cp-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #cp-splash .bar i { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <div id="cp-splash" role="status" aria-live="polite">
    <b>CityPulse</b>
    <span>Loading the map and routes&hellip;</span>
    <div class="bar"><i></i></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('cp-splash');
      if (s) s.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
