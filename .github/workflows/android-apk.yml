name: Android APK

# Builds an installable Android app (APK) on GitHub's servers, so no Android toolchain is needed on a laptop.
# Run it by hand: Actions tab -> "Android APK" -> Run workflow. The APK appears under "Artifacts" on the finished run.
#
# The APK is signed with the debug key (see app/android/app/build.gradle.kts), which is fine for installing on your own
# phone and NOT for the Play Store. Nothing here uploads the app anywhere.
#
# Status: the Android build has never been compiled before this workflow (KNOWN_FLAWS F-06). Expect to fix it over a few runs.
on:
  workflow_dispatch:
    inputs:
      ingest_url:
        description: "Where reports are sent (the live demo's report server)"
        default: "https://citypulse-idp.onrender.com/ingest"
      router_api_url:
        description: "Router API the app uses only if 'compute on the server' is chosen in Settings"
        default: "https://citypulse-idp.onrender.com/api"
      model_url:
        description: "Optional. Web address of the route-question model (a GGUF file) to put inside the APK. Leave empty for the normal build, which has no model."
        default: ""
      model_sha256:
        description: "Required when model_url is set: the SHA-256 of that file. The build stops if it does not match."
        default: ""

permissions:
  contents: write # only to attach a model-carrying APK to the release "android-test-app"

env:
  CODE: 01_code/citypulse-IDP

jobs:
  apk:
    name: Build release APK (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ${{ env.CODE }}/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # The maplibre_gl plugin compiles its Java as release 21 ("invalid source release: 21" on JDK 17).
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      # The exact Flutter the app was built and tested with (the app needs Dart 3.13.2 or newer).
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      # The map pack is copied in, not kept twice in git.
      - run: bash scripts/sync_data_assets.sh
      - run: flutter pub get
      # A measurement build (ADR-035, PREREGISTRATION_QA.md addendum 5): the model goes into the APK as an uncompressed Android asset and the
      # app is built to use it. The file must match the given SHA-256 or the build stops. A normal build skips all of this.
      - name: Fetch the route-question model
        if: ${{ inputs.model_url != '' }}
        env:
          MODEL_URL: ${{ inputs.model_url }}
          MODEL_SHA256: ${{ inputs.model_sha256 }}
        run: |
          test -n "$MODEL_SHA256" || { echo "model_sha256 is required with model_url"; exit 1; }
          mkdir -p android/app/src/main/assets/models
          curl -sfL --retry 3 -o android/app/src/main/assets/models/route_qa.gguf "$MODEL_URL"
          echo "$MODEL_SHA256  android/app/src/main/assets/models/route_qa.gguf" | sha256sum -c -
          ls -l android/app/src/main/assets/models/
      - name: Build
        run: >
          flutter build apk --release --target-platform android-arm64
          --dart-define=CITY=chennai
          --dart-define=INGEST_URL=${{ inputs.ingest_url }}
          --dart-define=ROUTER_API_URL=${{ inputs.router_api_url }}
          ${{ inputs.model_url != '' && '--dart-define=CITYPULSE_QA_MODEL=true' || '' }}
      - name: Size and checksum
        run: |
          ls -l build/app/outputs/flutter-apk/
          sha256sum build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: citypulse-android-arm64
          path: ${{ env.CODE }}/app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
      # A build with the model inside is also attached to a release, so it can be downloaded without a GitHub login and after the artifact expires.
      - name: Attach to the release (model builds only)
        if: ${{ inputs.model_url != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build/app/outputs/flutter-apk
          cp app-release.apk citypulse-android-arm64-with-model.apk
          sha256sum citypulse-android-arm64-with-model.apk > citypulse-android-arm64-with-model.apk.sha256
          notes="Android test build with the route-question test model inside (not adopted; labels questions only, the app's rules write the answers). Signed with a debug key: for your own phone. Built by the 'Android APK' workflow from commit ${{ github.sha }}; SHA-256 in the .sha256 file. Not yet run on a phone with the model: after installing, see docs/ops/MOBILE_TESTING.md for what to record."
          if gh release view android-test-app --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit android-test-app --repo "${{ github.repository }}" --notes "$notes"
          else
            gh release create android-test-app --repo "${{ github.repository }}" --prerelease --title "Android test app (with model)" --notes "$notes" --target "${{ github.sha }}"
          fi
          gh release upload android-test-app citypulse-android-arm64-with-model.apk citypulse-android-arm64-with-model.apk.sha256 --clobber --repo "${{ github.repository }}"
