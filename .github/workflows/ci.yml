name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CODE: 01_code/citypulse-IDP

jobs:
  dart:
    name: Dart · ${{ matrix.dir }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [packages/pulse_belief, packages/pulse_router, packages/pulse_explain, services/router_api]
    defaults:
      run:
        working-directory: ${{ env.CODE }}/${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart analyze
      - run: dart test

  flutter:
    name: Flutter app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.CODE }}/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # The app bundles the pinned map pack; it is copied in, not kept twice in git.
      - run: bash scripts/sync_data_assets.sh
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  python:
    name: Python · scripts, ingest server and event miner
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.CODE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ${{ env.CODE }}/scripts/requirements.txt
            ${{ env.CODE }}/server/requirements.txt
      - run: pip install -r scripts/requirements.txt -r server/requirements.txt
      # Tests that need large files outside git (the Chennai graph, the compiled router) skip themselves.
      # ml/ holds the event miner (ADR-030); its tests use a fake model server and need no Ollama.
      - run: pytest scripts/tests server ml -q
