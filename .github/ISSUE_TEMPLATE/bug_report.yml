name: Bug report
description: Something behaves wrongly, or a claim in the docs or UI is false
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you saw. For a wrong route include the start and end coordinates and the travel mode.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Router / belief
        - Explanation / verifier
        - Route advisor
        - Flutter app
        - Router API
        - Ingest server
        - Data pipeline
        - Docs / wording
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or branch
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Dart / Flutter / Python versions, browser if it is the web app.
  - type: checkboxes
    id: safety
    attributes:
      label: Wording
      options:
        - label: This is about text that says or implies a road is safe or passable (high priority)
